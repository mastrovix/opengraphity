name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # By hand on any branch (wave 7 · C2): a branch that is not yet a pull
  # request can run the checks against a real Neo4j before it becomes one.
  workflow_dispatch:
  # Weekly re-run of the dependency audit: new advisories appear without any
  # commit. Only the `audit` job runs on this trigger.
  schedule:
    - cron: "0 5 * * 1"   # Mondays 05:00 UTC

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# VITE_* values baked into the web/portal bundles built here: they only have
# to be valid URLs — CI never runs the bundles against a Keycloak
env:
  VITE_API_URL: /graphql
  VITE_KEYCLOAK_URL: http://localhost:8080
  VITE_KEYCLOAK_CLIENT_ID: opengrafo-web
  VITE_TENANT_SLUG: ""

jobs:
  build-and-test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Reads the pnpm version from the packageManager field in package.json
      - uses: pnpm/action-setup@v6

      # Node 24 per combaciare con le immagini di produzione
      # (node:24.11.1-bookworm-slim). Il vincolo su isolated-vm si e' invertito:
      # la 7 PRETENDE Node >= 24 — vedi apps/api/Dockerfile.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Shared packages must be built first: apps resolve
      # @opengraphity/* imports against each package's dist/
      # (includes web-core, consumed by apps/web and apps/portal)
      - name: Build packages
        run: pnpm --filter "./packages/*" build

      # infra/.env.example must document exactly the variables the code reads
      # (G-08): fails on used-but-undocumented or documented-but-dead keys
      - name: Check env documentation
        run: node scripts/check-env-example.mjs

      # Locale it/en allineati, chiavi usate esistenti, niente toast/bottoni con letterali
      - name: Check i18n
        run: node scripts/check-i18n.mjs

      # Il vocabolario dei log è GENERATO dai sorgenti: se qualcuno aggiunge un
      # messaggio d'errore e non lo rigenera, quelle parole diventano `<w>` nella
      # diagnostica di piattaforma e nessuno capisce più i template.
      - name: Check vocabolario dei log
        run: node scripts/genera-vocabolario-log.mjs --check

      # Una funzione NUOVA non supera le 60 istruzioni, e quelle già lunghe
      # possono solo rimpicciolire: è la misura di quanto c'è da tenere in
      # testa per rivederle. Gira dalla radice perché usa l'AST di TypeScript,
      # che la 7 non espone più (vedi il commento in testa allo script).
      - name: Check funzioni lunghe
        run: node scripts/check-funzioni-lunghe.mjs

      - name: Check token visivi (console ↔ portale)
        run: node scripts/check-token-visivi.mjs

      # Un carattere solo, e dichiarato in un posto solo: i bottoni non
      # ereditano il font, e la regola che glielo dava viveva in un foglio
      # di stile che nessuno importava (22 set 2026).
      - name: Un carattere solo in tutto il prodotto
        run: node scripts/check-font.mjs

      - name: Check etichette dei controlli
        run: node scripts/check-etichette-controlli.mjs

      - name: Check «Invio o Spazio attiva»
        run: node scripts/check-attiva-da-tastiera.mjs

      - name: Lint
        run: pnpm lint

      # `pnpm typecheck` = tsc --noEmit in every workspace package: api, web,
      # portal, web-core and the other packages
      - name: Typecheck
        run: pnpm typecheck

      # Every package/app with a `test` script except the API, which runs
      # below with coverage. All suites are mocked (no Neo4j/Redis needed).
      # La RADICE va esclusa insieme all'api, e il motivo non è ovvio (21 set
      # 2026): `pnpm --recursive` include anche il pacchetto di radice, il cui
      # script `test` è a sua volta un `pnpm --recursive test` — senza filtro.
      # Quindi `--filter "!@opengraphity/api"` veniva scavalcato: i test
      # dell'api giravano lo stesso, qui dove Neo4j non c'è, e fallivano con
      # «No routing servers available». Restava nascosto dietro altri rossi,
      # e si è visto solo quando tutto il resto è tornato verde.
      # Con la COPERTURA, non solo i test: `copertura.mjs` porta il pavimento di
      # ogni workspace, e un workspace che scende sotto il suo fa fallire qui.
      - name: Test packages, web, portal (con copertura)
        run: pnpm --recursive --if-present --filter "!@opengraphity/api" --filter "!opengraphity" test:coverage

      # apps/api/vitest.config.ts enforces the coverage floors on src/lib and
      # src/services: a regression fails this step
      - name: Test api (with coverage thresholds)
        run: pnpm --filter @opengraphity/api test:coverage

      # Dopo TUTTE le misure, non prima: legge i coverage-summary.json che
      # quelle scrivono. Controlla che nessun pavimento sia invecchiato, che
      # nessun workspace o area ne sia senza, e stampa la distanza dal 95%.
      - name: Check tetti di copertura
        run: node scripts/check-tetti-copertura.mjs

      - name: Upload api coverage summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: api-coverage
          path: apps/api/coverage/coverage-summary.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Build apps
        run: |
          pnpm --filter @opengraphity/api build
          pnpm --filter @opengraphity/web build
          VITE_KEYCLOAK_CLIENT_ID=opengrafo-portal pnpm --filter @opengraphity/portal build

  # ── Checks against a real Neo4j (wave 7 · C2) ───────────────────────────────
  # The other jobs mock the database. This one starts the Neo4j of the compose
  # (same image, same digest) and a Redis, both throwaway, and runs the same
  # command a developer runs: every migration on an empty database,
  # check-cypher, the integration suite (two tenants from the demo generator:
  # no query of one returns an id of the other) and the cross-tenant edges.
  neo4j-integration:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The API resolves @opengraphity/* against each package's dist/
      - name: Build packages
        run: pnpm --filter "./packages/*" build

      - name: Checks against a real Neo4j
        run: bash scripts/integration-neo4j.sh

  # ── Dependency audit (G-11): production dependencies, gate >= high, with the
  # explicit, expiring allowlist in audit-allowlist.json ──────────────────────
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      # The audit reads the lockfile and the registry only: no native builds
      - name: Install dependencies (no scripts)
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: pnpm audit --prod (allowlisted)
        run: node scripts/audit-check.mjs --level=high

  # ── Secret scanning (G-09): whole history of the push / PR range, rules and
  # allowlist in .gitleaks.toml ────────────────────────────────────────────────
  gitleaks:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
