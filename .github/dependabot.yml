# Dependabot (G-10): weekly update PRs for npm (pnpm workspace), the
# container base images and the GitHub Actions used by the workflows.
#
# npm minor/patch bumps arrive as ONE grouped PR per week; majors stay
# separate so each one gets its own review (express 5, @apollo/server 5,
# vite 8 … are deliberate migrations, see audit-allowlist.json).
version: 2

updates:
  # ── npm: the whole pnpm workspace (root + apps/* + packages/*) ─────────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Rome"
    open-pull-requests-limit: 10
    labels: ["dependencies", "npm"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
      security-patches:
        applies-to: security-updates
        update-types: ["minor", "patch"]
    ignore:
      # @types/node NON e' piu' escluso (21 set 2026): l'esclusione esisteva
      # perche' il runtime era fermo a Node 20, e quel vincolo e' caduto con
      # isolated-vm 7 (che Node >= 24 lo PRETENDE). Ora i tipi seguono il
      # runtime come devono. Se un giorno il runtime si rifermasse, e'
      # l'esclusione a tornare, non i tipi a restare indietro in silenzio.

  # ── Docker base images (FROM lines) ────────────────────────────────────────
  - package-ecosystem: "docker"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Rome"
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "chore(docker)"
    ignore:
      # node:24 di proposito, e il perche' e' scritto in apps/api/Dockerfile:
      # isolated-vm 7 vuole Node >= 24, e una major di Node va salita insieme
      # a isolated-vm, non da sola.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Rome"
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: "docker"
    directory: "/apps/portal"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Rome"
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "chore(docker)"
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # ── Images referenced by infra/docker-compose.yml (neo4j, redis, keycloak…)
  - package-ecosystem: "docker-compose"
    directory: "/infra"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Rome"
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "chore(docker)"
    ignore:
      # Neo4j 5 (vector indexes, APOC plugin) — a major is a migration
      - dependency-name: "neo4j"
        update-types: ["version-update:semver-major"]

  # ── GitHub Actions used by .github/workflows/* ─────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      timezone: "Europe/Rome"
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
