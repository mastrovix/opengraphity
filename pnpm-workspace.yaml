packages:
  - 'apps/*'
  - 'packages/*'

# One version per shared runtime/test dependency across the workspace (D-32):
# every package.json references these as "catalog:". Two copies of ioredis or
# two majors of vitest meant different behaviour between suites and duplicated
# dependencies in the image.
catalog:
  '@vitest/coverage-v8': ^5.0.1
  bullmq: ^6.0.4
  ioredis: ^6.0.0
  vitest: ^5.0.1

# VERSIONI BLOCCATE: non stanno qui, stanno in `package.json` → `pnpm.overrides`.
# Provato a metterle qui (21 set 2026) e pnpm 10.30 NON le legge da questo file:
# il blocco sembrava messo e non faceva niente. Verificato cambiando il numero e
# guardando che cosa veniva installato davvero.
#
# Blocco attivo: `@types/d3-selection` fermo a 3.0.11.
#   La 3.0.12 rompe `@types/d3-transition`, il pacchetto che innesta
#   `.transition()` su `Selection`: il build del web cade con «Property
#   'transition' does not exist on type Selection<...>» in `TopologyGraph.tsx` e
#   `CIGraph.tsx` (PR #27). Non e' una nostra scelta di versione: a monte 3.0.12
#   e 3.0.9 sono ENTRAMBE le ultime, e non si parlano.
#   SI TOGLIE quando `@types/d3-transition` pubblica una versione che regge la
#   3.0.12. Per provarlo: togliere l'override, `pnpm install`,
#   `pnpm --filter @opengraphity/web exec tsc --noEmit`.
#
# Blocco attivo: `ip-address` alzata a ^10.7.2.
#   `express-rate-limit` 8 la FISSA alla 10.1.0 esatta, e quella versione ha
#   GHSA-mwp4-54f8-5fhr (grave): `Address4` legge un ottetto con lo zero
#   iniziale come DECIMALE mentre i resolver lo leggono come OTTALE, e da li'
#   si passa per un indirizzo che non e' quello che sembra (SSRF).
#   Corretta dalla 10.3.1. La 7 di express-rate-limit non aveva questa
#   dipendenza affatto: l'avviso e' entrato con l'aggiornamento, ed e' stato
#   `audit-check` a dirlo prima che uscisse di qui.
#   SI TOGLIE quando `express-rate-limit` fissera' una versione >= 10.3.1.
