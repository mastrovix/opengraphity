# Secrets have NO defaults: `${VAR:?message}` makes `docker compose` refuse to
# start when a variable is missing or empty in infra/.env (see .env.example).
# Ports: only nginx listens on all interfaces. Every other service binds to
# 127.0.0.1 so the host's LAN/Tailscale peers cannot reach Redis, Neo4j, the
# API (bypassing nginx headers and CSP), Keycloak, Loki, Prometheus, Jaeger,
# Grafana.
# Images (G-16): every third-party image is pinned as `tag@sha256:digest`
# (multi-arch manifest-list digest, resolved with `docker buildx imagetools
# inspect <image:tag>`). Bumping a version = change tag AND digest together;
# docs/DEPLOY.md keeps the table. Node images are pinned in apps/*/Dockerfile.

services:

  # ── Infrastructure ─────────────────────────────────────────────────────────

  neo4j:
    image: neo4j:5.26.21-community@sha256:409728716bc239f9fa046368ac6ce6ef280f9e5f0bcb7cdd75031a4465cc192d
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD mancante in infra/.env}"
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      # Explicit memory bounds — without them Neo4j sizes itself on host RAM
      # and is the first OOM candidate on the machine
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    mem_limit: 2g
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - opengrafo-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:7474"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7.4.8-alpine@sha256:7aec734b2bb298a1d769fd8729f13b8514a41bf90fcdd1f38ec52267fbaa8ee6
    # Password-protected: every client (api, worker) reads the same
    # REDIS_URL + REDIS_PASSWORD through packages/events getRedisConnection().
    # AOF with fsync every second (revisione 2 · D7.4): BullMQ lives here —
    # alerts accepted with 202 and not yet ingested, delayed correlations,
    # repeat jobs, idempotency markers. With RDB snapshots only, a crash (not a
    # clean stop: SIGTERM saves) lost up to 15 minutes of that state and an
    # alert accepted from the sender was gone for good. Cost: ~1 s of writes
    # at most on a crash. docs/OPERATIONS.md «Procedure di ripristino».
    # La password NON sta nella riga di comando (revisione totale · H-31): con
    # `--requirepass <password>` la si leggeva da `docker inspect`, da `ps`
    # sull'host e nei log di compose. Si scrive in un file di configurazione
    # dentro il container, da una variabile d'ambiente.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD mancante in infra/.env}
      # redis-cli legge la password da qui: nemmeno l'healthcheck la mette in `ps`.
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD mancante in infra/.env}
    entrypoint: ["sh", "-c", "umask 077 && printf 'requirepass %s\\nappendonly yes\\nappendfsync everysec\\n' \"$$REDIS_PASSWORD\" > /tmp/redis.conf && exec redis-server /tmp/redis.conf"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - opengrafo-network
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # MinIO removed (Ondata 4): zero references in the code — attachments live on
  # the api_data volume (ATTACHMENT_DIR). The old `minio_data` volume is left
  # untouched; docs/DEPLOY.md explains how to drop it by hand if wanted.

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5@sha256:f8ade94c1d0ad2f2fa7734a455fee5392764f402c43ca35e9af6bf63a2541dc9
    container_name: opengrafo-keycloak
    # Dev mode + H2 file DB: fine for the single-host stack, NOT for production
    # (no clustering, file DB not backup-friendly). The migration to `start` +
    # Postgres, with the export/import procedure, is in docs/DEPLOY.md.
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD mancante in infra/.env}"
      KC_DB: dev-file
      KC_HTTP_PORT: 8080
      KC_HEALTH_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
    networks:
      - opengrafo-network
    healthcheck:
      # The Keycloak image has no curl/wget — probe /health/ready via bash /dev/tcp
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"status\": \"UP\"' <&3"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  # ── Observability ──────────────────────────────────────────────────────────

  # Scrapes GET /metrics of the API (apps/api/src/middleware/metrics.ts).
  # Access policy of the endpoint: with METRICS_TOKEN set the scraper must send
  # `Authorization: Bearer <token>`; when empty the API admits only loopback and
  # private (docker) socket addresses — which this container is. Prometheus
  # cannot expand env vars in its config, so the token is written to a file at
  # start and read through `authorization.credentials_file`.
  prometheus:
    image: prom/prometheus:v2.55.1@sha256:2659f4c2ebb718e7695cb9b25ffa7d6be64db013daba13e05c875451cf51b0d3
    container_name: opengrafo-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        umask 077
        printf '%s' "$${METRICS_TOKEN:-}" > /tmp/metrics_token
        exec /bin/prometheus \
          --config.file=/etc/prometheus/prometheus.yml \
          --storage.tsdb.path=/prometheus \
          --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Alerting rules (revisione 2 · D7.1): evaluated by Prometheus itself
      # (GET /api/v1/rules, /alerts); an Alertmanager is not part of the stack.
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks:
      - opengrafo-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.4.0@sha256:b0ae311af06228bcfd4a620504b653db80f5b91e94dc3dc2a5b7dab202bcde20
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      # Applied on the FIRST start only (the admin user then lives in
      # grafana_data): change it later from the UI or `grafana cli admin reset-admin-password`.
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD mancante in infra/.env}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      # Datasources (Loki, Prometheus) + dashboard provider
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      # Provisioned dashboards (JSON) — read by the provider above
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    networks:
      - opengrafo-network
    depends_on:
      loki:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.56@sha256:d2cd4c226624bdc116decd3106091b4df9882da8db42f8550293596cab79b8ea
    container_name: jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      # Badger on a volume: traces survive container restarts (memory storage lost them)
      - SPAN_STORAGE_TYPE=badger
      - BADGER_EPHEMERAL=false
      - BADGER_DIRECTORY_VALUE=/badger/data
      - BADGER_DIRECTORY_KEY=/badger/key
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4318:4318"
    volumes:
      - jaeger_data:/badger
    mem_limit: 512m
    healthcheck:
      # Admin port: `/` answers 200 once collector + query are up (busybox wget in the image)
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:14269/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - opengrafo-network

  loki:
    image: grafana/loki:2.9.0@sha256:b025a0220f390baaab01578aea2fe0ba677584d9f248c3fe5af15f84dd1de60d
    container_name: opengrafo-loki
    ports:
      - "127.0.0.1:3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      # H-17: senza volume indice e chunk vivevano nel filesystem del
      # container, quindi un `up -d --force-recreate loki` (o un aggiornamento
      # dell'immagine) azzerava tutta la storia dei log — e promtail, che
      # conserva le posizioni di lettura in promtail_data, non le rispediva.
      # OPERATIONS §6 manda a quei log per gli incidenti operativi.
      - loki_data:/loki
    networks:
      - opengrafo-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Ships the stdout/stderr of every compose container to Loki, discovered
  # through the Docker socket (docker_sd_configs — read-only mount). The API
  # logs to stdout only (pino): the old file scrape of /tmp never saw a line.
  promtail:
    image: grafana/promtail:2.9.0@sha256:c2c423196c75a2c9c26f6fe0ba7200c3167334b14975747f5dcff678bd1a32e9
    container_name: opengrafo-promtail
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
      # Read positions survive restarts (no duplicate lines after `up -d`)
      - promtail_data:/var/lib/promtail
    command: -config.file=/etc/promtail/config.yml
    networks:
      - opengrafo-network
    depends_on:
      loki:
        condition: service_healthy
    restart: unless-stopped

  # ── Front door ─────────────────────────────────────────────────────────────

  # Reverse proxy for subdomain routing (c-one.localhost, portal.c-one.localhost)
  # and the Tailscale HTTPS front door. The config is a template
  # (infra/nginx/default.conf.template): the image's entrypoint renders
  # /etc/nginx/templates/*.template into /etc/nginx/conf.d with envsubst,
  # restricted by NGINX_ENVSUBST_FILTER to OUR variables so nginx's own
  # $host/$remote_addr/$upstream_* are left alone.
  nginx:
    image: nginx:1.28.3-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    container_name: opengrafo-nginx
    ports:
      - "80:80"
    environment:
      # Hostname served by `tailscale serve` (HTTPS front door, iPad access)
      TAILSCALE_HOST: ${TAILSCALE_HOST:?TAILSCALE_HOST mancante in infra/.env (hostname del front-door HTTPS Tailscale, es. my-mac.tailnet.ts.net)}
      # Browser-facing Keycloak origin allowed in the CSP connect-src of the
      # *.localhost server blocks (single origin; KEYCLOAK_PUBLIC_URL may list more for the API)
      KEYCLOAK_PUBLIC_ORIGIN: ${KEYCLOAK_PUBLIC_ORIGIN:-http://localhost:8080}
      # Tenant host the Tailscale front door impersonates (X-Forwarded-Host):
      # the Tailscale hostname carries no tenant slug
      TAILSCALE_TENANT_HOST: ${TAILSCALE_TENANT_HOST:-c-one.localhost}
      # Corpo massimo accettato su /api/ (revisione totale · H-11): era 11m
      # fisso, «pari al limite di 10 MB degli allegati» — ma da quando la
      # dimensione massima e una scelta dell'organizzazione fino a
      # ATTACHMENT_MAX_MB_CAP (default 100 MB), nginx rispondeva 413 in HTML
      # prima che l'API vedesse la richiesta, e l'impostazione appena salvata
      # sembrava non valere. Tenerlo un po' sopra il tetto: e l'API a dire di
      # no, con il suo messaggio.
      NGINX_API_MAX_BODY: ${NGINX_API_MAX_BODY:-101m}
      NGINX_ENVSUBST_FILTER: ^(TAILSCALE_HOST|KEYCLOAK_PUBLIC_ORIGIN|TAILSCALE_TENANT_HOST|NGINX_API_MAX_BODY)$$
    volumes:
      - ./nginx:/etc/nginx/templates:ro
    networks:
      - opengrafo-network
    healthcheck:
      # TCP-only: an HTTP probe would proxy to upstreams and report THEIR health
      test: ["CMD-SHELL", "nc -z 127.0.0.1 80"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      - keycloak
      - api
      - web
      - portal
    restart: unless-stopped

  # ── Application ────────────────────────────────────────────────────────────

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: opengrafo-api:local
    ports:
      # Loopback only: reaching the API without nginx would let a client set
      # X-Forwarded-Host/-For itself (tenant cross-check + rate limit bypass)
      - "127.0.0.1:4000:4000"
    environment:
      NODE_ENV: production
      # Embedding inference runs in the dedicated `worker` service (below), so
      # the API event loop stays free for requests.
      EMBEDDING_WORKER_EXTERNAL: "true"
      # Process profile (revisione 2 · D1.1, apps/api/src/lib/workerProfiles.ts):
      # `api` = this process serves HTTP and the ITSM workers only; the Event
      # Management / Servizi monitorati workers run in `events-worker` (below).
      # `all` (the default outside compose) would run everything in here.
      WORKER_PROFILE: api
      # Neo4j connections of this process (default 50): HTTP resolvers + ITSM workers.
      NEO4J_MAX_POOL_SIZE: "50"
      # Pending migrations stop the start instead of only being logged (docs/OPERATIONS.md §3).
      REQUIRE_APPLIED_MIGRATIONS: ${REQUIRE_APPLIED_MIGRATIONS:-false}
      # Apollo introspection/Sandbox: off by default with NODE_ENV=production.
      # Set GRAPHQL_INTROSPECTION=true in infra/.env to use the Sandbox locally.
      GRAPHQL_INTROSPECTION: ${GRAPHQL_INTROSPECTION:-false}
      PORT: "4000"
      LOG_LEVEL: ${LOG_LEVEL:-info}

      # Neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:?NEO4J_PASSWORD mancante in infra/.env}"

      # Redis — one form for every package (packages/events/src/redis.ts)
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD mancante in infra/.env}"

      # Keycloak
      # Internal URL — used by the API for JWKS fetch and admin calls (Docker network)
      KEYCLOAK_URL: http://keycloak:8080
      # Public URL — the origin browsers use; tokens carry this in their `iss` claim
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8080}
      # I client delle app a cui l'API crede (token emessi per altri client rifiutati): gli stessi dei bundle.
      KEYCLOAK_APP_CLIENT_IDS: "${VITE_KEYCLOAK_CLIENT_ID:-opengrafo-web},${VITE_KEYCLOAK_CLIENT_ID_PORTAL:-opengrafo-portal},${VITE_KEYCLOAK_CLIENT_ID_CONSOLE:-opengrafo-console}"
      # ── La console di piattaforma (17 set 2026) ──────────────────────────────
      # Senza queste due, ogni richiesta a `/platform` è rifiutata: la console
      # non esiste dove nessuno l'ha configurata. Niente default, nemmeno qui.
      PLATFORM_REALM: ${PLATFORM_REALM:-}
      PLATFORM_CONSOLE_HOST: ${PLATFORM_CONSOLE_HOST:-}
      # Gli indirizzi delle app di un tenant, con `{slug}`: li mostra la console.
      TENANT_URL_TEMPLATE: ${TENANT_URL_TEMPLATE:-}
      PORTAL_URL_TEMPLATE: ${PORTAL_URL_TEMPLATE:-}
      KEYCLOAK_ADMIN_USER: admin
      KEYCLOAK_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD mancante in infra/.env}"

      # Security
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET mancante in infra/.env}"
      ALLOW_LEGACY_JWT: ${ALLOW_LEGACY_JWT:-false}
      DISCOVERY_ENCRYPTION_KEY: ${DISCOVERY_ENCRYPTION_KEY:-}
      # Bearer token Prometheus must present on GET /metrics (empty = docker network only)
      METRICS_TOKEN: ${METRICS_TOKEN:-}

      # Email (Resend)
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-OpenGrafo <onboarding@resend.dev>}
      # `true` = questa installazione non manda posta: ogni messaggio finisce
      # nei log e viene scartato. Lo annuncia all'avvio. Il digest gira dentro
      # questo container, quindi è qui che l'interruttore conta.
      EMAIL_SEND_DISABLED: ${EMAIL_SEND_DISABLED:-false}

      # Storage (api_data volume; backups on their own volume — see below)
      ATTACHMENT_DIR: /data/attachments
      BACKUP_DIR: /data/backups
      REPORT_DIR: /data/reports

      # CORS — allow web and portal origins (subdomain routing + direct port access)
      CORS_ORIGIN: ${CORS_ORIGIN:-http://*.localhost,http://localhost:5173,http://localhost:5174,http://localhost}

      # Observability. Il preload fa partire OTEL PRIMA dell'app: senza,
      # l'auto-strumentazione non patcha express/neo4j/ioredis (già caricati) e
      # in Jaeger restano solo gli span dell'operazione GraphQL — revisione
      # totale · A-23. È inerte con OTEL_ENABLED=false.
      NODE_OPTIONS: --import=/app/dist/telemetry-register.js
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_ENDPOINT: http://jaeger:4318/v1/traces

      # Embeddings (semantic similarity: incident simili + KB suggerita)
      # local = Transformers.js ONNX in-process (default, nessun servizio esterno)
      # voyage = Voyage AI API (richiede VOYAGE_API_KEY)
      EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER:-local}
      TRANSFORMERS_CACHE: /data/models
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}

      # Limits — revisione totale · H-10: erano documentate in .env.example
      # (e in OPERATIONS/DEPLOY) ma NON arrivavano al container, quindi
      # scriverle in infra/.env non cambiava niente.
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-1000}
      RATE_LIMIT_WINDOW_MINUTES: ${RATE_LIMIT_WINDOW_MINUTES:-1}
      GRAPHQL_SCHEMA_CACHE_MAX: ${GRAPHQL_SCHEMA_CACHE_MAX:-25}
      MAX_CI_TYPES_PER_TENANT: ${MAX_CI_TYPES_PER_TENANT:-200}
      ATTACHMENT_MAX_MB_CAP: ${ATTACHMENT_MAX_MB_CAP:-100}
      # Backup notturno (maintenance worker, che gira in QUESTO processo)
      BACKUP_RETENTION: ${BACKUP_RETENTION:-14}
      BACKUP_SKIP_KEYCLOAK: ${BACKUP_SKIP_KEYCLOAK:-false}
      # Durata dei due registri di log (ondata 3): quello del server e quello del browser
      SERVER_LOG_RETENTION_DAYS: ${SERVER_LOG_RETENTION_DAYS:-90}
      # Tetto mensile di gettoni degli analisti autonomi (rimedio c): la chiave
      # Anthropic è una sola per tutta la piattaforma, e senza tetto un cliente
      # solo poteva prosciugare il budget di tutti gli altri.
      AI_MONTHLY_TOKEN_BUDGET_TENANT: ${AI_MONTHLY_TOKEN_BUDGET_TENANT:-2000000}
      AI_MONTHLY_TOKEN_BUDGET_PLATFORM: ${AI_MONTHLY_TOKEN_BUDGET_PLATFORM:-20000000}

      # Optional integrations
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # DEPLOY dice «un solo posto da cambiare»: che sia vero (H-10).
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      REPORT_AI_MODEL: ${REPORT_AI_MODEL:-}
      # Slack (ondata 8): il token di ogni organizzazione sta nel grafo, cifrato con
      # SECRETS_ENCRYPTION_KEY. Qui solo l'app Slack DI OPENGRAFO («Aggiungi a Slack»)
      # e l'indirizzo pubblico da cui Slack raggiunge OpenGrafo.
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:-}
      SLACK_CLIENT_ID: ${SLACK_CLIENT_ID:-}
      SLACK_CLIENT_SECRET: ${SLACK_CLIENT_SECRET:-}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      APP_URL: ${APP_URL:-http://localhost}

    volumes:
      - api_data:/data
      # G-17: backups on a dedicated volume, separate from attachments/models —
      # losing api_data no longer takes the backups with it. Copy it off-host
      # (docs/DEPLOY.md "Backup").
      - api_backups:/data/backups
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - opengrafo-network
    healthcheck:
      # The api image has no wget/curl — probe with node's built-in fetch.
      # /health/live, not /health (revisione totale · H-48): /health answers 503
      # while migrations are pending, which is right for an operator but wrong
      # for a container probe — during the documented two-step deploy (new image
      # up, then `migrate`) `docker compose ps` showed the API red as if it had
      # crashed. /health/live answers the container's question: is this process
      # alive and are Neo4j and Redis reachable.
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # Dedicated worker process: runs the CPU-bound embedding worker off the API
  # event loop. Same image as api, different entrypoint (WORKER_PROFILE=all →
  # embedding only in the worker process; apps/api/src/lib/workerProfiles.ts).
  worker:
    image: opengrafo-api:local
    command: ["node", "--no-node-snapshot", "dist/worker.js"]  # isolated-vm su Node >= 20
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REQUIRE_APPLIED_MIGRATIONS: ${REQUIRE_APPLIED_MIGRATIONS:-false}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:?NEO4J_PASSWORD mancante in infra/.env}"
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD mancante in infra/.env}"
      EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER:-local}
      TRANSFORMERS_CACHE: /data/models
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      # Il token Slack delle organizzazioni si legge cifrato dal grafo (ondata 8)
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:-}
      # GET /metrics of this process (scraped by prometheus as `worker:4000`)
      PORT: "4000"
      METRICS_TOKEN: ${METRICS_TOKEN:-}
    volumes:
      - api_data:/data
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - opengrafo-network
    healthcheck:
      # No HTTP API in this process: the probe (baked into the image, see
      # apps/api/Dockerfile) asks Redis whether an `embeddings` BullMQ worker
      # is connected. Caveat: it counts every worker of that queue on the
      # Redis server, i.e. it is per-queue, not per-container.
      test: ["CMD", "node", "worker-healthcheck.mjs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    restart: unless-stopped

  # Event Management + Servizi monitorati worker (revisione 2 · D1.1): the
  # alert ingest, correlation and maintenance queues, the service-map
  # evaluation queue and the `service-impact-consumer` — ~12 job slots that
  # used to run inside the API process on its Neo4j pool. Same image,
  # WORKER_PROFILE=events; the API runs with WORKER_PROFILE=api and starts none
  # of them. Scale this service, not the API, when alert storms grow.
  events-worker:
    image: opengrafo-api:local
    command: ["node", "--no-node-snapshot", "dist/worker.js"]
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WORKER_PROFILE: events
      REQUIRE_APPLIED_MIGRATIONS: ${REQUIRE_APPLIED_MIGRATIONS:-false}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:?NEO4J_PASSWORD mancante in infra/.env}"
      # 12 slots × up to 3 sessions per event (pipeline + CI health + grouping)
      NEO4J_MAX_POOL_SIZE: "40"
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD mancante in infra/.env}"
      # The validation of the worker profile reads them; no embedding runs here.
      EMBEDDINGS_PROVIDER: ${EMBEDDINGS_PROVIDER:-local}
      TRANSFORMERS_CACHE: /data/models
      # Correlation may call the AI triage of new incidents (optional, like in the API)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # H-10: lo stesso modello dell'API, altrimenti la triage dal worker usa un altro modello.
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      # Il token Slack delle organizzazioni si legge cifrato dal grafo (ondata 8)
      SECRETS_ENCRYPTION_KEY: ${SECRETS_ENCRYPTION_KEY:-}
      # GET /metrics of this process: the pipeline metrics live where the
      # pipeline runs (scraped by prometheus as `events-worker:4000`)
      PORT: "4000"
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      # Liveness probe: an `events-ingest` worker connected to Redis (see `worker`)
      HEALTHCHECK_QUEUE: events-ingest
    volumes:
      - api_data:/data
    depends_on:
      neo4j:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - opengrafo-network
    healthcheck:
      test: ["CMD", "node", "worker-healthcheck.mjs"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  web:
    # NB: apps/web/Dockerfile è single-stage e COPIA apps/web/dist: non compila.
    # Le VITE_* vanno passate al build LOCALE (vedi README, "Deploy web"):
    #   set -a; . infra/.env; set +a; pnpm --filter @opengraphity/web build
    # Prima qui c'erano `args` VITE_* identiche a quelle del portal ma
    # silenziosamente ignorate: cambiarle in .env aggiornava il portal e non il web.
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - api
    networks:
      - opengrafo-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ── LA CONSOLE DI PIATTAFORMA (17 set 2026) ────────────────────────────────
  # Crea, rinomina, sospende e cancella i TENANT: non appartiene a nessuno di
  # loro, e per questo ha un host e un realm Keycloak suoi.
  #
  # `PLATFORM_REALM` non ha default nemmeno qui: senza, l'API rifiuta ogni
  # richiesta alla console e il bundle si ferma all'avvio. È voluto — una
  # console che si crea da sé su ogni installazione è una porta che nessuno ha
  # chiesto di aprire.
  console:
    build:
      context: ..
      dockerfile: apps/console/Dockerfile
      args:
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:?VITE_KEYCLOAK_URL mancante in infra/.env (URL Keycloak raggiungibile dal browser)}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID_CONSOLE:-opengrafo-console}
        VITE_PLATFORM_REALM: ${PLATFORM_REALM:?PLATFORM_REALM mancante in infra/.env (il realm Keycloak degli amministratori di piattaforma)}
    ports:
      - "127.0.0.1:5175:80"
    depends_on:
      - api
    networks:
      - opengrafo-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  portal:
    build:
      context: ..
      dockerfile: apps/portal/Dockerfile
      args:
        # Browser-accessible URLs — NOT internal Docker service names
        VITE_API_URL: /graphql
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:?VITE_KEYCLOAK_URL mancante in infra/.env (URL Keycloak raggiungibile dal browser)}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID_PORTAL:-opengrafo-portal}
        # Set to your tenant slug to access portal at localhost:5174 (no subdomain)
        VITE_TENANT_SLUG: ${VITE_TENANT_SLUG:-}
    ports:
      - "127.0.0.1:5174:80"
    depends_on:
      - api
    networks:
      - opengrafo-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

networks:
  opengrafo-network:
    driver: bridge

volumes:
  neo4j_data:
  neo4j_logs:
  redis_data:
  grafana_data:
  keycloak_data:
  api_data:
  # Neo4j JSONL backups (BACKUP_DIR) — separate from api_data on purpose
  api_backups:
  jaeger_data:
  prometheus_data:
  # H-17: indice e chunk di Loki (altrimenti la storia dei log muore col container)
  loki_data:
  promtail_data:
